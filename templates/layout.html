<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <title>
            {% if title %}
                Habit Tracker - {{ title }}
            {% else %}
                Habit Tracker
            {% endif %}
        </title>

        <meta name="description" content="Habit tracker - a way to track your habits!">
        <meta name="author" content="dobr">

        <meta property="og:title" content="Habit Tracker">
        <meta property="og:type" content="website">
        <meta property="og:url" content="">
        <meta property="og:image" content="">
        <meta property="og:image:alt" content="">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
              rel="stylesheet" 
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
              crossorigin="anonymous">

        <link rel="stylesheet" type="text/css" href="/static/css/main.css">
        <meta name="theme-color" content="#272261">

        <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
        <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon.png">
        <link rel="manifest" href="/static/site.webmanifest">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="site-header">
            <nav class="navbar navbar-expand-md bg-steel fixed-top" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand me-4" href="#">Habit Tracker</a>
                    <button class="navbar-toggler" 
                            type="button" 
                            data-bs-toggle="collapse" 
                            data-bs-target="#navbarToggle" 
                            aria-controls="navbarToggle" 
                            aria-expanded="false" 
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarToggle">
                        <div class="navbar-nav me-auto">
                            <a class="nav-link active" aria-current="page" href="{{ url_for('home') }}">Home</a>
                        </div>

                        <div class="navbar-nav align-items-center">
                            <a class="btn btn-outline-light mb-2 mb-md-0 me-md-2" href="#">Login</a>
                            <a class="btn btn-light mb-2 mb-md-0 me-md-3" href="#">Register</a>
                            
                            <!-- Clean Theme Switcher Dropdown -->
                            <div class="nav-item dropdown">
                                <button class="btn nav-link dropdown-toggle bg-transparent border-0" 
                                        type="button" 
                                        id="bd-theme" 
                                        data-bs-toggle="dropdown" 
                                        aria-expanded="false">
                                    <span id="bd-theme-text">🌗 Auto</span>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme">
                                    <li>
                                        <button class="dropdown-item" type="button" data-bs-theme-value="light">☀️ Light</button>          
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button" data-bs-theme-value="dark">🌑 Dark</button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button" data-bs-theme-value="auto">🌗 Auto</button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main role="main" class="container my-5 pt-4">
            <div class="row">
                <div class="col-md-8">
                    {% block content %}
                    {% endblock content %}
                </div>
                <aside class="col-md-4">
                    <div class="content-section py-3 px-4 mb-4">
                        <h3>Our Sidebar</h3>
                        <p class="text-body-secondary">Placeholder</p>
                        <ul class="list-group">
                            <li class="list-group-item">Your Habits</li>
                            <li class="list-group-item">New habits</li>
                            <li class="list-group-item">Calendar</li>
                        </ul>
                    </div>
                </aside>
            </div>
        </main>

        <footer class="mt-auto py-3 bg-body-tertiary border-top">
            <div class="container text-center">
                <p class="text-body-secondary mb-0">
                    ©<span id="year"></span> dobr
                </p>
            </div>
        </footer>

        <script>document.getElementById("year").textContent = new Date().getFullYear();</script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

        <script>
            const setTheme = (theme) => {
                const htmlElement = document.documentElement;
                
                let actualTheme = theme;
                if (theme === "auto") {
                    actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                
                htmlElement.setAttribute("data-bs-theme", actualTheme);
                localStorage.setItem("theme", theme);

                const themeText = {
                    light: "☀️ Light", 
                    dark: "🌑 Dark", 
                    auto: "🌗 Auto"
                };
                
                const textElement = document.getElementById("bd-theme-text");
                if (textElement) {
                    textElement.textContent = themeText[theme] || "🌗 Auto";
                }
            };

            const savedTheme = localStorage.getItem("theme") || "auto";
            setTheme(savedTheme);

            document.addEventListener("DOMContentLoaded", () => {
                document.querySelectorAll("[data-bs-theme-value]").forEach(button => {
                    button.addEventListener("click", () => {
                        const selectedTheme = button.getAttribute("data-bs-theme-value");
                        setTheme(selectedTheme);
                    });
                });
            });
        </script>
    </body>
</html>
