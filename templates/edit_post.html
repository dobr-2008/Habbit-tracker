{% extends "layout.html" %}
{% block content %}
    <h1 class="mb-4">Edit Post</h1>
    <form method="post" action="{{ url_for('update_post_page', post_id=post.id) }}">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ post.title }}" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" id="content" name="content" rows="6" required>{{ post.content }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('post_page', post_id=post.id) }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock content %}
